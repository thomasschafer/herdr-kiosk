[package]
name = "herdr-kiosk"
version = "0.3.0"
edition = "2024"
description = "Fuzzy repo and branch picker for Herdr"
license = "MIT"

[dependencies]
anyhow = "1"
kiosk-core = "0.4"
kiosk-tui = "0.4"
kiosk-serve = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kiosk-core = { version = "0.4", features = ["test-support"] }
tempfile = "3"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true

[profile.release]
lto = true

[patch.crates-io]
kiosk-core = { git = "https://github.com/thomasschafer/kiosk", rev = "64b478545295e54aba289d52b77069c9d1787f6c" }
kiosk-tui = { git = "https://github.com/thomasschafer/kiosk", rev = "64b478545295e54aba289d52b77069c9d1787f6c" }
kiosk-serve = { git = "https://github.com/thomasschafer/kiosk", rev = "64b478545295e54aba289d52b77069c9d1787f6c" }
kiosk-docgen = { git = "https://github.com/thomasschafer/kiosk", rev = "64b478545295e54aba289d52b77069c9d1787f6c" }
