[package]
name = "herdr-kiosk"
version = "0.1.0"
edition = "2024"
description = "Fuzzy repo and branch picker for Herdr"
license = "MIT"

[dependencies]
anyhow = "1"
kiosk-core = { git = "https://github.com/thomasschafer/kiosk", rev = "b259e6a88bab585811491a0c5c3d63d8db02fac7" }
kiosk-tui = { git = "https://github.com/thomasschafer/kiosk", rev = "b259e6a88bab585811491a0c5c3d63d8db02fac7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kiosk-core = { git = "https://github.com/thomasschafer/kiosk", rev = "b259e6a88bab585811491a0c5c3d63d8db02fac7", features = ["test-support"] }
tempfile = "3"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true

[profile.release]
lto = true
